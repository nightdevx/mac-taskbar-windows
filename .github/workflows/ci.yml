name: CI

# Tests on develop and on pull requests. Nothing deploys from here; releases
# are published by hand from main.
on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test
